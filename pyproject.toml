[project]
name = "miniprojekti"
version = "0.1.0"
description = ""
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "flask (>=3.1.2,<4.0.0)",
    "flask-sqlalchemy (>=3.1.1,<4.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)"
]

[dependency-groups]
dev = [
    "robotframework (>=7.3.2,<8.0.0)",
    "robotframework-browser (>=20.5.0)",
    "robotframework-browser-batteries (>=20.5.0)",
    "pytest (>=8.4.2,<10.0.0)",
    "pylint>=4.1.4",
]

[tool.uv]
package = false

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring",
    "missing-final-newline",
]
