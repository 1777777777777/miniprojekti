<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add book reference</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="form-page">
    <main class="book-form-panel">
        <h1>Add book reference</h1>
        <form class="book-form" method="post" action="{{ url_for('new_reference') }}">
            <label for="key">Citation key</label>
            <input id="key" name="key" required>

            <label for="author">Author</label>
            <input id="author" name="author" required>

            <label for="title">Book title</label>
            <input id="title" name="title" required>

            <label for="year">Publication year</label>
            <input id="year" name="year" type="number" step="1" required>

            <label for="publisher">Publisher</label>
            <input id="publisher" name="publisher" required>

            <label for="pages">Pages (optional)</label>
            <input id="pages" name="pages" placeholder="42 or 42–48">

            <div class="form-actions">
                <button type="submit" disabled>Save reference</button>
                <a href="{{ url_for('index') }}">Cancel</a>
            </div>
            <p class="form-status">Saving is not available yet.</p>
        </form>
    </main>
</body>
</html>
